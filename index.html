<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz + Caça Níquel</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <div id="quiz">
    <h2>Descubra sua comida ideal!</h2>
    <div id="pergunta-container"></div>
  </div>

  <div class="machine" id="game" style="display:none;">
    <div class="lights">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>

    <div class="screen">
      <img src="imagens/interrogacao.png" alt="slot" id="slotImg" />
    </div>

    <div class="buttons">
      <div class="button"></div>
      <div class="button"></div>
      <div class="button"></div>
    </div>

    <div class="lever-container">
      <div class="lever" id="lever" title="Puxa a alavanca para girar"></div>
      <span class="lever-text">Puxar a alavanca para girar</span>
    </div>

    <div id="resultado"></div>
  </div>
  
  <div id="comidas-voadoras"></div>

  <script src="index.js"></script>
</body>
</html>
